{% extends 'base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-xl-8 col-lg-7">
            <div class="card shadow-sm border-0 rounded-4 mb-4">
                <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                    <h5 class="m-0 fw-bold text-primary"><i class="bi bi-receipt-cutoff me-2"></i>Inventory Bill Entry</h5>
                    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill font-monospace" id="live-clock">00:00:00</span>
                </div>
                
                <div class="card-body pt-0">
                    <div class="row g-3 mb-4 bg-light p-3 rounded-4 mx-0 border">
                        <div class="col-md-7">
                            <label class="fw-bold small text-muted text-uppercase mb-2"><i class="bi bi-person-bounding-box me-1"></i> Select Account Customer</label>
                            <select id="customer-select" class="form-select select2-box" onchange="updateOutstanding()">
                                <option value="" data-balance="0">Search by Name or Mobile No...</option>
                                {% for c in customers %}
                                <option value="{{ c.id }}" data-balance="{{ c.total_balance }}" data-mobile="{{ c.mobile }}">
                                    {{ c.name }} — {{ c.mobile }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-5 text-md-end text-center">
                            <label class="fw-bold small text-muted text-uppercase mb-2"><i class="bi bi-wallet2 me-1"></i> Current Outstanding</label>
                            <h3 class="fw-bold text-danger m-0 font-monospace" id="outstanding-display">Rs. 0.00</h3>
                        </div>
                    </div>

                    <div class="table-responsive" style="min-height: 400px;">
                        <table class="table table-hover align-middle">
                            <thead class="bg-light">
                                <tr class="text-muted small text-uppercase">
                                    <th class="ps-3" style="width: 30%;">Product</th>
                                    <th class="text-center">Retail</th>
                                    <th class="text-center" style="width: 100px;">TP %</th>
                                    <th class="text-center" style="width: 130px;">Rate (TP)</th>
                                    <th class="text-center" style="width: 100px;">Qty</th>
                                    <th class="text-end">Total</th>
                                    <th class="text-center"></th>
                                </tr>
                            </thead>
                            <tbody id="cart-body">
                                <tr>
                                    <td colspan="7" class="py-5 text-center text-muted">
                                        <i class="bi bi-cart-x fs-1 d-block mb-2 opacity-25"></i>
                                        Scan barcode or search items to start billing
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 mb-3">
                <div class="card-body p-4">
                    <div class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden">
                        <span class="input-group-text bg-white border-end-0 text-primary"><i class="bi bi-upc-scan"></i></span>
                        <input type="text" id="barcode-search" class="form-control border-start-0 font-monospace ps-0" placeholder="Scan Barcode (S...)" oninput="searchProduct(this.value)" autofocus>
                    </div>
                    
                    <div class="list-group mt-3 overflow-auto custom-scrollbar" style="max-height: 300px;" id="search-results">
                        {% for p in products %}
                        <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center product-item p-3" 
                                data-name="{{ p.name | lower }}" data-barcode="{{ p.barcode }}"
                                onclick="addItemToCart('{{ p.id }}', '{{ p.name }}', '{{ p.retail_price }}', '{{ p.tp_percent }}', '{{ p.stock }}')">
                            <div>
                                <span class="fw-bold d-block text-dark">{{ p.name }}</span>
                                <div class="d-flex gap-2">
                                    <span class="badge bg-secondary bg-opacity-10 text-secondary small">Stock: {{ p.stock }}</span>
                                    <span class="text-muted small">Code: {{ p.barcode }}</span>
                                </div>
                            </div>
                            <i class="bi bi-plus-circle-fill text-primary fs-4"></i>
                        </button>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="card shadow border-0 bg-dark text-white rounded-4 overflow-hidden">
                <div class="card-body p-4 pt-5 pb-5">
                    <div class="d-flex justify-content-between mb-2 opacity-75">
                        <span class="text-uppercase small fw-bold">Gross Total (Retail)</span>
                        <span id="gross-total" class="font-monospace">Rs. 0.00</span>
                    </div>
                    <hr class="border-secondary opacity-25">
                    <div class="py-3">
                        <label class="text-warning small text-uppercase fw-bold mb-1">Net Inventory Bill (TP)</label>
                        <h1 class="display-5 fw-bold text-warning m-0 font-monospace" id="net-total">Rs. 0.00</h1>
                    </div>
                    
                    <button class="btn btn-success btn-lg w-100 fw-bold py-3 mt-4 shadow rounded-3 border-0" id="btn-submit" onclick="submitInventorySale()">
                        <i class="bi bi-cloud-arrow-up-fill me-2"></i> POST TO INVENTORY
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Select2 Initialization for smart search
$(document).ready(function() {
    $('.select2-box').select2({
        theme: 'bootstrap-5',
        width: '100%',
        placeholder: 'Search by Name or Mobile...'
    });
});

let cart = [];
let scanTimer;

// Clock Display
setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString(); }, 1000);

// Barcode Search Logic
function searchProduct(query) {
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => {
        let q = query.toLowerCase().trim();
        if (q.startsWith('s')) { q = q.substring(1); } // Barcode leading 'S' fix

        let items = document.querySelectorAll('.product-item');
        items.forEach(item => {
            let bc = item.getAttribute('data-barcode').toLowerCase();
            let name = item.getAttribute('data-name');
            
            if (q !== "" && bc === q) {
                item.click();
                document.getElementById('barcode-search').value = "";
            }
            item.classList.toggle('d-none', !(name.includes(q) || bc.includes(q)));
        });
    }, 150);
}

function updateOutstanding() {
    let sel = document.getElementById('customer-select');
    let selectedOption = sel.options[sel.selectedIndex];
    let bal = parseFloat(selectedOption.getAttribute('data-balance') || 0);
    document.getElementById('outstanding-display').innerText = "Rs. " + bal.toLocaleString(undefined, {minimumFractionDigits: 2});
}

function addItemToCart(id, name, retail, tpPct, stock) {
    if(parseInt(stock) <= 0) { 
        Swal.fire('Out of Stock', 'Is item ka stock maujood nahi hai.', 'error');
        return; 
    }
    let existing = cart.find(i => i.id === id);
    let r = parseFloat(retail);
    let p = parseFloat(tpPct) || 0;
    let initialRate = r - (r * (p / 100));

    if (existing) {
        if(existing.qty < stock) existing.qty++;
    } else {
        cart.push({ id: id, name: name, retail: r, tp_pct: p, rate: initialRate, qty: 1, max: stock });
    }
    renderCart();
}

function renderCart() {
    let body = document.getElementById('cart-body');
    
    // --- RESET LOGIC AGAR CART EMPTY HO ---
    if(cart.length === 0) {
        body.innerHTML = '<tr><td colspan="7" class="py-5 text-center text-muted"><i class="bi bi-cart-x fs-1 d-block mb-2 opacity-25"></i>Select items to start</td></tr>';
        
        // Ye do lines total ko zero karengi jab products remove honge
        document.getElementById('gross-total').innerText = "Rs. 0.00";
        document.getElementById('net-total').innerText = "Rs. 0.00";
        return;
    }

    body.innerHTML = "";
    let gross = 0, net = 0;
    
    cart.forEach((item, index) => {
        let total = item.rate * item.qty;
        gross += item.retail * item.qty;
        net += total;
        
        body.innerHTML += `
            <tr class="border-bottom">
                <td class="ps-3 fw-bold text-dark">${item.name}</td>
                <td class="text-center small text-muted font-monospace">Rs. ${item.retail}</td>
                <td>
                    <input type="number" class="form-control form-control-sm text-center border-0 bg-success bg-opacity-10 text-success fw-bold" 
                           value="${item.tp_pct}" oninput="updateByPct(${index}, this.value)">
                </td>
                <td>
                    <input type="number" class="form-control form-control-sm text-center border-0 bg-primary bg-opacity-10 text-primary fw-bold" 
                           value="${item.rate.toFixed(2)}" oninput="updateByRate(${index}, this.value)">
                </td>
                <td>
                    <input type="number" class="form-control form-control-sm text-center border-light shadow-sm" 
                           value="${item.qty}" min="1" onchange="updateQty(${index}, this.value)">
                </td>
                <td class="text-end fw-bold font-monospace">Rs. ${total.toFixed(2)}</td>
                <td class="text-center">
                    <button class="btn btn-sm text-danger" onclick="removeItem(${index})"><i class="bi bi-x-circle-fill"></i></button>
                </td>
            </tr>`;
    });

    // Formatting with commas for final display
    document.getElementById('gross-total').innerText = "Rs. " + gross.toLocaleString(undefined, {minimumFractionDigits: 2});
    document.getElementById('net-total').innerText = "Rs. " + net.toLocaleString(undefined, {minimumFractionDigits: 2});
}
function updateByPct(i, val) {
    let v = parseFloat(val) || 0;
    cart[i].tp_pct = v;
    cart[i].rate = cart[i].retail - (cart[i].retail * (v / 100));
    renderCart();
}

function updateByRate(i, val) {
    let v = parseFloat(val) || 0;
    cart[i].rate = v;
    cart[i].tp_pct = (((cart[i].retail - v) / cart[i].retail) * 100).toFixed(1);
    renderCart();
}

function updateQty(i, v) { cart[i].qty = parseInt(v) || 1; renderCart(); }
function removeItem(i) { cart.splice(i, 1); renderCart(); }
function submitInventorySale() {
    let cid = document.getElementById('customer-select').value;
    if(!cid || cart.length === 0) { 
        if (typeof Swal !== 'undefined') {
            Swal.fire('Required', 'Meherbani karke customer aur items select karein.', 'warning');
        } else {
            alert('Meherbani karke customer aur items select karein.');
        }
        return; 
    }

    let btn = document.getElementById('btn-submit');
    let originalBtnHTML = `<i class="bi bi-cloud-arrow-up-fill me-2"></i> POST TO INVENTORY`; 

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Posting...`;

    // AGAR EXTERNAL JS HAI: Is URL string ko template data attribute se replace karein (e.g., dynamic endpoint)
    const targetUrl = "{% url 'process_inventory_sale' %}"; 

    fetch(targetUrl, {
        method: "POST",
        headers: { 
            "Content-Type": "application/json", 
            "X-CSRFToken": "{{ csrf_token }}" 
        },
        body: JSON.stringify({ customer_id: cid, items: cart })
    })
    .then(r => {
        if (!r.ok) { throw new Error("Server Error: " + r.status); }
        return r.json();
    })
    .then(data => {
        // .toLowerCase() isliye use kiya taake 'success' ya 'Success' dono conditions handle ho sakein seamlessly
        if(data.status && data.status.toLowerCase() === 'success') {
            
            // Backend ka rich data structured array ke sath localStorage me save kiya
            localStorage.setItem('last_invoice_data', JSON.stringify(data));
            
            let printUrl = `/pos/inventory/inventory_invoice_print/${data.invoice_no}/`;
            
            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: 'Sale Posted Successfully!',
                    text: `Invoice No: ${data.invoice_no}. Kya aap bill print karna chahte hain?`,
                    icon: 'success',
                    showCancelButton: true,
                    confirmButtonText: '⚡ Print Bill',
                    cancelButtonText: 'Skip / New Bill',
                    confirmButtonColor: '#198754',
                    cancelButtonColor: '#6c757d',
                    allowOutsideClick: false
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.open(printUrl, '_blank');
                    }
                    cart = []; // Memory state safety cleanup
                    window.location.reload(); // Standard way to refresh page
                });
            } else {
                let askPrint = confirm(`Sale Success! Invoice: ${data.invoice_no}\n\nKya aap bill print karna chahte hain?`);
                if(askPrint) {
                    window.open(printUrl, '_blank');
                }
                cart = [];
                window.location.reload();
            }

        } else {
            if (typeof Swal !== 'undefined') {
                Swal.fire('Error', data.message || 'Kuch ghalat hua.', 'error');
            } else {
                alert('Error: ' + (data.message || 'Kuch ghalat hua.'));
            }
            btn.disabled = false;
            btn.innerHTML = originalBtnHTML;
        }
    })
    .catch(err => {
        console.error("Critical JS Error:", err);
        if (typeof Swal !== 'undefined') {
            Swal.fire('Crash Error', 'Server connection error ya code crash! Meherbani karke page manual refresh karein.', 'error');
        } else {
            alert('Server connection error ya code crash! Meherbani karke page manual refresh (F5) karein.');
        }
        btn.disabled = false;
        btn.innerHTML = originalBtnHTML;
    });
}
</script>

<style>
    .select2-container--bootstrap-5 .select2-selection {
        border-radius: 12px;
        height: calc(3.5rem + 2px);
        display: flex;
        align-items: center;
        border: 1px solid #dee2e6;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    .product-item { transition: all 0.2s; border-radius: 10px !important; margin-bottom: 5px; border: 1px solid #eee !important; }
    .product-item:hover { background-color: #f8f9fa; border-color: #0d6efd !important; transform: translateX(5px); }
</style>
{% endblock %}
